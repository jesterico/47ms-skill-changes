<style>
  :root {
    --bg: hsl(210, 64%, 4%);
    --card: rgba(10, 15, 28, 0.6);
    --panel: rgba(10, 15, 28, 0.75);
    --border: rgba(255, 255, 255, 0.1);
    --fg: hsl(160, 25%, 96%);
    --muted: hsl(200, 12%, 63%);
    --neon: #39ff7a;
    --radius: 0.75rem;
    --c-buff: #39ff7a;
    --c-nerf: #ff5c7a;
    --c-mixed: #ffc229;
    --c-change: #5cc8ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Assistant', system-ui, sans-serif;
    min-height: 100dvh;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(57, 255, 122, 0.07), transparent),
      radial-gradient(ellipse 900px 500px at 90% 0%, rgba(80, 190, 240, 0.05), transparent);
    background-attachment: fixed;
  }

  .container { max-width: 1360px; margin: 0 auto; padding: 0 1.25rem; }

  /* ============ header ============ */
  header { padding: 2rem 0 1rem; }
  .header-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .header-row img.logo { width: 56px; height: 50px; filter: drop-shadow(0 0 12px rgba(57,255,122,.35)); }
  h1 { font-size: 1.7rem; font-weight: 800; margin: 0; letter-spacing: 0.01em; }
  h1 .accent { color: var(--neon); text-shadow: 0 0 18px rgba(57,255,122,.45); }
  .subtitle { color: var(--muted); margin: 0.15rem 0 0; font-size: 0.95rem; }

  /* ============ class tabs ============ */
  .class-tabs {
    display: flex; flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px; gap: 4px;
    margin-top: 1.25rem;
    backdrop-filter: blur(12px);
    width: fit-content; max-width: 100%;
  }
  .class-tab {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 1rem; font-weight: 700;
    color: var(--muted); background: transparent;
    padding: 0.55rem 1.1rem;
    border-radius: calc(var(--radius) - 4px);
    display: flex; align-items: center; gap: 0.5rem;
    transition: all .2s ease;
  }
  .class-tab:hover { color: var(--fg); }
  .class-tab.active {
    background: rgba(57, 255, 122, 0.14);
    color: var(--neon);
    box-shadow: inset 0 0 0 1px rgba(57, 255, 122, 0.35);
  }
  .class-tab img { width: 22px; height: 22px; image-rendering: pixelated; }
  .class-tab .count {
    font-family: var(--mono); font-size: 0.72rem; font-weight: 400;
    background: rgba(255,255,255,0.07); border: 1px solid var(--border);
    padding: 1px 7px; border-radius: 6px; color: var(--muted);
  }
  .class-tab.active .count { color: var(--neon); border-color: rgba(57,255,122,.3); background: rgba(57,255,122,.08); }

  /* ============ toolbar ============ */
  .toolbar {
    position: sticky; top: 0; z-index: 40;
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem;
    margin: 1rem 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem;
  }
  .search-wrap { position: relative; flex: 1 1 240px; min-width: 200px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  #search {
    width: 100%; height: 38px;
    font-family: inherit; font-size: 0.95rem;
    color: var(--fg);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px);
    padding: 0 2.2rem 0 2.3rem;
    outline: none;
    transition: border-color .2s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: rgba(57, 255, 122, 0.45); box-shadow: 0 0 0 3px rgba(57,255,122,.08); }
  #clear-search {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 1rem; padding: 4px 8px; border-radius: 6px; display: none;
  }
  #clear-search:hover { color: var(--fg); background: rgba(255,255,255,.06); }

  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .chips .sep { width: 1px; height: 24px; background: var(--border); margin: 0 0.2rem; }
  .chip {
    appearance: none; cursor: pointer;
    height: 38px;
    font-family: inherit; font-size: 0.82rem; font-weight: 700;
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 0.8rem;
    display: inline-flex; align-items: center; gap: 0.4rem;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .chip:hover { color: var(--fg); border-color: rgba(255,255,255,.25); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color, var(--muted)); box-shadow: 0 0 6px var(--chip-color, transparent); }
  .chip .n { font-family: var(--mono); font-size: 0.7rem; font-weight: 400; opacity: 0.75; }
  .chip.active {
    color: var(--chip-color, var(--fg));
    border-color: var(--chip-color, var(--fg));
    background: color-mix(in srgb, var(--chip-color, #fff) 12%, transparent);
  }

  /* ============ job sections ============ */
  .job { margin-bottom: 1.8rem; }
  .job-head { display: flex; align-items: baseline; gap: 0.6rem; margin: 0 0 0.7rem; }
  .job-head h2 { font-size: 1.15rem; font-weight: 800; margin: 0; }
  .job-head .crumb { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .job-head .count {
    font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    padding: 1px 7px; border-radius: 6px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 0.8rem;
  }

  .skill-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color .2s ease, transform .15s ease, box-shadow .2s ease;
  }
  .skill-card:hover {
    border-color: color-mix(in srgb, var(--rc) 45%, transparent);
    transform: translateY(-2px);
    box-shadow: 0 6px 22px -8px color-mix(in srgb, var(--rc) 35%, transparent);
  }
  .skill-top {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.7rem 0.8rem;
    border-bottom: 1px solid var(--border);
    background:
      radial-gradient(ellipse 80% 120% at 0% 50%, color-mix(in srgb, var(--rc) 9%, transparent), transparent),
      rgba(255, 255, 255, 0.02);
  }
  .skill-icon {
    width: 44px; height: 44px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35); border: 1px solid var(--border); border-radius: 8px;
  }
  .skill-icon img { width: 32px; height: 32px; image-rendering: pixelated; }
  .skill-name { font-size: 1rem; font-weight: 800; line-height: 1.2; margin: 0; flex: 1; min-width: 0; }
  .skill-id { display: block; font-family: var(--mono); font-size: 0.68rem; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .type {
    font-size: 0.7rem; font-weight: 700; color: var(--muted);
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    padding: 0 7px; border-radius: 999px; white-space: nowrap;
  }
  .tag {
    font-size: 0.66rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    font-family: var(--mono);
    color: var(--rc);
    background: color-mix(in srgb, var(--rc) 13%, transparent);
    border: 1px solid color-mix(in srgb, var(--rc) 35%, transparent);
    padding: 1px 7px; border-radius: 999px;
    white-space: nowrap;
  }

  .changes { padding: 0.55rem 0.8rem 0.7rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .chg { display: grid; grid-template-columns: minmax(96px, 38%) 1fr; gap: 0.6rem; align-items: baseline; font-size: 0.9rem; }
  .chg .lbl { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
  .chg .vals { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem; font-family: var(--mono); font-size: 0.82rem; }
  .chg .old { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.25); }
  .chg .arr { color: var(--muted); }
  .chg .new { font-weight: 700; color: var(--dc); }
  .lvpill {
    font-weight: 700; color: var(--dc);
    background: color-mix(in srgb, var(--dc) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--dc) 28%, transparent);
    border-radius: 6px; padding: 0 6px;
  }
  .lvpill b { font-weight: 400; color: var(--muted); margin-right: 3px; }
  .chg.note { display: flex; gap: 0.45rem; color: var(--dc); font-weight: 600; font-size: 0.86rem; }
  .chg.note::before { content: '✦'; color: var(--dc); opacity: .8; }
  .up { --dc: var(--c-buff); }
  .down { --dc: var(--c-nerf); }
  .flat { --dc: var(--fg); }

  /* ============ empty state ============ */
  #empty {
    display: none;
    text-align: center; padding: 4rem 1rem; color: var(--muted);
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
    margin-bottom: 4rem;
  }
  #empty b { color: var(--fg); }
  #empty button {
    margin-top: 1rem; appearance: none; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 0.9rem;
    color: var(--neon); background: rgba(57,255,122,.1);
    border: 1px solid rgba(57,255,122,.35); border-radius: 8px; padding: 0.5rem 1.2rem;
  }

  footer {
    text-align: center; color: var(--muted); font-size: 0.78rem; font-family: var(--mono);
    padding: 1.5rem 0 2.5rem;
  }

  @media (max-width: 640px) {
    .container { padding: 0 1rem; }
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 1.35rem; }
    .class-tab { padding: 0.45rem 0.7rem; font-size: 0.9rem; }
  }
</style>
</head>

  DATA.forEach((cls, ci) => {
    const first = cls.jobs[0].skills.find((s) => s.icon);  // fallback when class_icons/ has no file
    addTab(ci, cls.name, cls.icon || (first && first.icon), skills.filter((s) => s.ci === ci).length, slug(cls.name));
  });

  function scope() {
    if (query) return skills.filter((s) => s.hay.includes(query));
    return current < 0 ? skills : skills.filter((s) => s.ci === current);
  }

  // Two chip groups: skill type (Attack/Buff/…) | change direction (Upgrade/Downgrade/…).
  // Each group's counts respect the other group's active filter.
  function renderChips(items) {
    const chipsEl = $('chips');
    chipsEl.innerHTML = '';
    const group = (keys, active, keyOf, other, label, color, set) => {
      const pool = items.filter(other);
      const counts = {};
      for (const s of pool) counts[keyOf(s)] = (counts[keyOf(s)] || 0) + 1;
      for (const k of ['All', ...keys]) {
        const n = k === 'All' ? pool.length : (counts[k] || 0);
        if (k !== 'All' && !n && active !== k) continue;
        const chip = document.createElement('button');
        chip.className = 'chip' + (k === active ? ' active' : '');
        if (color(k)) chip.style.setProperty('--chip-color', color(k));
        chip.innerHTML = `${label(k)} <span class="n">${n}</span>`;
        chip.addEventListener('click', () => { set(k); render(); });
        chipsEl.appendChild(chip);
      }
    };
    group(Object.keys(TYPES), type, (s) => s.type, (s) => tag === 'All' || s.tag === tag,
      (k) => k === 'All' ? 'All types' : `${TYPES[k]} ${k}`, () => null, (k) => { type = k; });
    chipsEl.insertAdjacentHTML('beforeend', '<span class="sep"></span>');
    group(Object.keys(TAGS), tag, (s) => s.tag, (s) => type === 'All' || s.type === type,
      (k) => k === 'All' ? 'All changes' : `<span class="dot"></span>${TAGS[k].plural}`,
      (k) => TAGS[k] && TAGS[k].color, (k) => { tag = k; });
  }

  function changeHtml(c) {
    if (c.note) return `<div class="chg note ${c.dir}">${esc(c.note)}</div>`;
    const news = c.parts.length > 1 || c.parts[0].lv
      ? c.parts.map((p) => `<span class="lvpill">${p.lv ? `<b>${esc(p.lv)}</b>` : ''}${esc(p.val)}</span>`).join('')
      : `<span class="new">${esc(c.parts[0].val)}</span>`;
    return `<div class="chg ${c.dir}"><span class="lbl">${esc(c.label)}</span><span class="vals"><span class="old">${esc(c.old)}</span><span class="arr">→</span>${news}</span></div>`;
  }

  function cardHtml(s) {
    return `<article class="skill-card" style="--rc:${TAGS[s.tag].color}">
      <div class="skill-top">
        <div class="skill-icon">${s.icon ? `<img src="${s.icon}" alt="" loading="lazy">` : ''}</div>
        <p class="skill-name">${esc(s.name)}<span class="skill-id">${esc(s.id)}</span></p>
        <div class="badges">
          <span class="tag">${TAGS[s.tag].label}</span>
          <span class="type">${TYPES[s.type] || ''} ${esc(s.type || '')}</span>
        </div>
      </div>
      <div class="changes">${s.parsed.map(changeHtml).join('')}</div>
    </article>`;
  }

  function render() {
    for (const b of tabsEl.children) b.classList.toggle('active', !query && +b.dataset.ci === current);
    const inScope = scope();
    renderChips(inScope);
    const items = inScope.filter((s) => (tag === 'All' || s.tag === tag) && (type === 'All' || s.type === type));
    const showClass = query || current < 0;

    // group by class + job, keeping data order
    const groups = new Map();
    for (const s of items) {
      const k = `${s.ci}/${s.ji}`;
      if (!groups.has(k)) groups.set(k, { cls: s.cls, job: s.job, items: [] });
      groups.get(k).items.push(s);
    }
    $('content').innerHTML = [...groups.values()].map((g) => `
      <section class="job">
        <div class="job-head">
          ${showClass ? `<span class="crumb">${esc(g.cls)} ›</span>` : ''}
          <h2>${esc(g.job)}</h2><span class="count">${g.items.length}</span>
        </div>
        <div class="grid">${g.items.map(cardHtml).join('')}</div>
      </section>`).join('');

    $('empty').style.display = items.length ? 'none' : 'block';
    if (!items.length) $('empty-term').textContent = query ? `"${query}"` : 'the current filter';
  }

  // ---- search ----
  const searchEl = $('search');
  let debounce;
  searchEl.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      query = searchEl.value.trim().toLowerCase();
      $('clear-search').style.display = query ? 'block' : 'none';
      render();
    }, 120);
  });
  function clearAll() {
    searchEl.value = ''; query = ''; tag = 'All'; type = 'All';
    $('clear-search').style.display = 'none';
    render();
  }
  $('clear-search').addEventListener('click', () => { clearAll(); searchEl.focus(); });
  $('empty-clear').addEventListener('click', clearAll);

  // ---- init (#all, #warrior, #magician … picks the tab; default All) ----
  const fromHash = DATA.findIndex((c) => slug(c.name) === location.hash.slice(1));
  if (fromHash >= 0) current = fromHash;
  render();
})();
